# Stop btusb from enabling USB autosuspend on the Bluetooth radio.
#
# This kernel is built with CONFIG_BT_HCIBTUSB_AUTOSUSPEND=y, so btusb defaults
# enable_autosuspend=true and calls usb_enable_autosuspend() during probe. With
# usbcore.autosuspend=2 the radio suspends after 2s idle, and on this machine it
# can come back wedged hard enough to kill the xHCI controller it sits on.
#
# See data/udev/81-bluetooth-no-autosuspend.rules for the full failure mode.
# This is the authoritative fix: the udev rule runs on usb device add, but btusb's
# probe runs after that and would re-enable autosuspend.
options btusb enable_autosuspend=0
